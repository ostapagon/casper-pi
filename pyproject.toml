[project]
name = "casper-pi"
version = "0.1.0"
description = "Casper voice assistant for Raspberry Pi"
requires-python = ">=3.10"
dependencies = [
    "vosk>=0.3.45",
    "pyaudio>=0.2.14",
    "google-genai>=0.3.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "python-dotenv>=1.0.0",
    "lgpio>=0.2.0.0",
    "spidev>=3.5",
    "Pillow>=9.0.0",
    "adafruit-blinka",
    "adafruit-circuitpython-ssd1351",
    "mcp>=0.1.0",
    "httpx>=0.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-telegram-bot>=20.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

